workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: never
    - when: always

stages:
  - test
  - deploy:staging
  - verify:staging
  - deploy:production
  - verify:production

variables:
  NODE_CONTAINER: node:24-alpine

.node:
  image: ${NODE_CONTAINER}
  before_script:
    - apk add --no-cache make g++ python3
    - yarn install --frozen-lockfile

test:unit:
  extends: .node
  stage: test
  script:
    - yarn test:unit
    - yarn test:integration

test:snyk:
  stage: test
  image: ${NODE_CONTAINER}
  script:
    - npm install -g npm@latest
    - npm install -g snyk
    - snyk auth ${SNYK_TOKEN}
    - snyk test --all-projects
    - snyk code test
  allow_failure: true

.deploy:
  image: alpine:3.22
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  variables:
    AWS_WEB_IDENTITY_TOKEN_FILE: /tmp/oidc-token
    AWS_ROLE_SESSION_NAME: gitlab-${CI_PIPELINE_ID}
  before_script:
    - apk add --no-cache aws-cli git jq
    - echo "$GITLAB_OIDC_TOKEN" > "$AWS_WEB_IDENTITY_TOKEN_FILE"

.smoke:
  image: alpine:3.22
  before_script:
    - apk add --no-cache curl
  script:
    - sh scripts/smoke-test.sh "$SMOKE_URL"
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

deploy:staging:
  extends: .deploy
  stage: deploy:staging
  needs: [test:unit]
  environment: staging
  resource_group: amplify-staging
  script:
    - NEXT_PUBLIC_APP_ENV=$CI_ENVIRONMENT_NAME sh scripts/amplify-deploy.sh develop
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

smoke:staging:
  extends: .smoke
  stage: verify:staging
  needs: [deploy:staging]
  environment:
    name: staging
    action: access

deploy:production:
  extends: .deploy
  stage: deploy:production
  needs: [smoke:staging]
  environment: production
  resource_group: amplify-production
  script:
    - git push "https://oauth2:${GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "${CI_COMMIT_SHA}:refs/heads/main"
    - NEXT_PUBLIC_APP_ENV=$CI_ENVIRONMENT_NAME sh scripts/amplify-deploy.sh main
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual

smoke:production:
  extends: .smoke
  stage: verify:production
  needs: [deploy:production]
  environment:
    name: production
    action: access
