version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 24
        - HUSKY=0 yarn install --frozen-lockfile
    build:
      commands:
        - env | grep -e '^AH_' >> .env.production
        - yarn build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
